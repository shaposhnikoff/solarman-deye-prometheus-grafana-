name: solarman-exporter

services:
  solarman-exporter:
    container_name: solarman-exporter
    image: solarman-exporter:local
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${SOLARMAN_BIND_ADDR:-0.0.0.0}:9800:9800"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:9800/metrics", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
