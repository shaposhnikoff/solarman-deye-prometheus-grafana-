[project]
name = "solarman-prometheus-exporter"
version = "0.1.0"
description = "Standalone Prometheus exporter for Solarman V5 inverters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.13",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "pysolarmanv5>=3.0.6",
    "pyyaml>=6.0.3",
    "uvicorn>=0.51.0",
]

[project.scripts]
solarman-exporter = "solarman_exporter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solarman_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
